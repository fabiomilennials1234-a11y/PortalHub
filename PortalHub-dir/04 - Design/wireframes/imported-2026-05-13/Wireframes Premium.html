<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1400" />
<title>PortalHub — Premium B2B Redesign</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,400;1,8..60,500&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  html,body{margin:0;padding:0;background:#e9e4d5;font-family:'Geist','Inter',-apple-system,BlinkMacSystemFont,sans-serif;color:#14181f;-webkit-font-smoothing:antialiased;font-feature-settings:'ss01','cv11'}
  #root{min-height:100vh}

  /* ────────── Premium tokens ────────── */
  .wf{
    --ink:#14181f;            /* deep ink (slate-near-black) */
    --ink-soft:#3a4452;       /* secondary */
    --ink-mid:#6b7280;        /* muted */
    --ink-low:#a3a6ad;        /* faint */
    --paper:#f6f3eb;          /* warm cream */
    --paper-2:#efeadd;        /* slightly darker tone */
    --paper-3:#e8e1cf;        /* even darker, for headers */
    --line:#14181f1f;         /* hairline */
    --line-soft:#14181f12;
    --line-faint:#14181f08;
    --navy:#1a3a5f;           /* primary navy */
    --navy-dk:#0f2a47;
    --gold:#b08a3e;           /* muted antique gold */
    --gold-dk:#8a6c2c;
    --gold-bg:#f0e6c8;        /* gold tint background */
    --accent:#1a3a5f;         /* legacy accent var, now navy */
    --good:#2f6a3a;           /* understated forest */
    --bad:#8a2a2a;            /* oxblood */
    font-family:'Geist','Inter',sans-serif;
    color:var(--ink);
    background:var(--paper);
    position:relative;
    overflow:hidden;
    letter-spacing:-0.003em;
  }
  .wf, .wf *{box-sizing:border-box}

  /* Serif display for "Hand" — premium editorial */
  .wf-hand{
    font-family:'Source Serif 4', 'Source Serif Pro', Georgia, serif;
    font-weight:500;
    letter-spacing:-0.018em;
    font-feature-settings:'lnum','ss01';
    color:var(--ink);
  }
  .wf-mono{font-family:'Geist Mono','JetBrains Mono',monospace;letter-spacing:0.04em;text-transform:uppercase;font-size:10.5px;font-weight:500}
  .wf-label{font-family:'Geist Mono',monospace;color:var(--ink-mid);font-size:10.5px;letter-spacing:0.06em;text-transform:uppercase}

  /* Placeholder — restrained, no diagonal stripes */
  .wf-ph{
    position:relative;
    background:var(--paper-2);
    border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    color:var(--ink-mid);
    font-family:'Geist Mono',monospace;font-size:10.5px;letter-spacing:.04em;
    text-transform:uppercase;
    text-align:center;padding:8px;
    border-radius:3px;
  }
  .wf-ph.wf-dashed{border-style:dashed}
  .wf-ph.wf-soft{border-color:var(--line-soft);color:var(--ink-mid)}
  .wf-ph.wf-img{background:
      linear-gradient(135deg,#efeadd 0%,#e3dbc4 100%),
      var(--paper-2);position:relative}
  .wf-ph.wf-img::before{content:"";position:absolute;inset:0;background:
      repeating-linear-gradient(135deg, #14181f08 0 1px, transparent 1px 24px)}

  /* Boxes / cards — square corners, hairline borders */
  .wf-box{border:1px solid var(--line);background:var(--paper);border-radius:3px}
  .wf-box.wf-soft{border-color:var(--line-soft)}
  .wf-box.wf-rough{border-radius:3px}
  .wf-card{background:var(--paper);border:1px solid var(--line);border-radius:3px;padding:14px}

  /* Pills — minimal hairline, square */
  .wf-pill{
    display:inline-flex;align-items:center;gap:6px;
    padding:3px 9px;border:1px solid var(--line);
    border-radius:3px;background:var(--paper);
    font-size:11px;font-weight:500;letter-spacing:-0.005em;
    color:var(--ink-soft);
  }
  .wf-pill.wf-accent{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .wf-pill.wf-gold{background:var(--gold-bg);border-color:var(--gold);color:var(--gold-dk)}
  .wf-pill.wf-ghost{background:transparent;border-color:transparent;color:var(--ink-mid)}

  /* Buttons — flat, no offset shadow, square edges */
  .wf-btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    padding:8px 14px;border:1px solid var(--ink);
    border-radius:3px;font-weight:500;font-size:13px;
    background:var(--paper);color:var(--ink);cursor:pointer;
    box-shadow:none;font-family:inherit;letter-spacing:-0.005em;
    transition:background .1s;
  }
  .wf-btn.wf-primary{background:var(--ink);color:var(--paper)}
  .wf-btn.wf-gold{background:var(--gold);color:#fff;border-color:var(--gold-dk)}
  .wf-btn.wf-ghost{border-color:transparent;background:transparent;color:var(--ink-mid)}
  .wf-btn.wf-sm{padding:5px 11px;font-size:12px}

  /* Subtle gold underline (replaces the playful coral mark) */
  .wf-underline{position:relative;display:inline-block}
  .wf-underline::after{
    content:"";position:absolute;left:0;right:0;bottom:0.12em;height:1px;
    background:var(--gold);
  }
  .wf-underline-soft{
    box-shadow:inset 0 -2px 0 0 var(--gold-bg), inset 0 -3px 0 0 var(--gold);
    padding:0 1px;
  }

  /* Avatars — premium: square-ish rounded with letter in serif */
  .wf-av{
    width:34px;height:34px;border-radius:3px;border:1px solid var(--line);
    background:var(--paper-2);display:inline-flex;align-items:center;justify-content:center;
    font-family:'Source Serif 4', Georgia, serif;font-size:14px;font-weight:500;color:var(--ink);
    letter-spacing:-0.01em;
  }
  .wf-av.wf-sm{width:24px;height:24px;font-size:11px;border-radius:2px}
  .wf-av.wf-lg{width:50px;height:50px;font-size:18px;border-radius:3px}
  .wf-av.wf-xl{width:78px;height:78px;font-size:26px;border-radius:4px}

  /* Hairlines */
  .wf-hr{border:none;border-top:1px solid var(--line);margin:14px 0}
  .wf-hr.wf-soft{border-top-style:dashed;border-color:var(--line-soft)}

  /* Annotations / notes — italic serif, no slant */
  .wf-note{
    position:absolute;font-family:'Source Serif 4', Georgia, serif;
    font-style:italic;font-size:12.5px;color:var(--gold-dk);
    line-height:1.3;pointer-events:none;
  }

  /* Browser chrome */
  .wf-chrome{
    display:flex;align-items:center;gap:10px;
    padding:10px 16px;border-bottom:1px solid var(--line);
    background:var(--paper-2)
  }
  .wf-chrome .wf-dots{display:flex;gap:5px}
  .wf-chrome .wf-dots i{
    width:9px;height:9px;border-radius:50%;
    border:1px solid var(--line);background:var(--paper);display:block
  }
  .wf-chrome .wf-url{
    flex:1;padding:4px 12px;border:1px solid var(--line);
    border-radius:3px;font-family:'Geist Mono',monospace;
    font-size:10.5px;color:var(--ink-mid);background:var(--paper);
    letter-spacing:0.02em;
  }

  /* Progress bar — flat, gold fill */
  .wf-bar{
    height:4px;border:none;border-radius:99px;
    background:var(--paper-3);overflow:hidden
  }
  .wf-bar > i{display:block;height:100%;background:var(--gold);border-radius:99px}

  /* Scribble svg styles (legacy from Callout) */
  .wf-scribble{stroke:var(--gold);stroke-width:1;fill:none;stroke-linecap:round}
  .wf-scribble-ink{stroke:var(--ink);stroke-width:1;fill:none;stroke-linecap:round}

  /* Sidebar nav */
  .wf-nav-item{
    display:flex;align-items:center;gap:10px;
    padding:7px 10px;border-radius:3px;font-size:13px;
    color:var(--ink-soft);font-weight:500;letter-spacing:-0.005em;
  }
  .wf-nav-item.wf-on{background:var(--ink);color:var(--paper)}
  .wf-nav-item .wf-ic{
    width:16px;height:16px;border:1px solid currentColor;
    border-radius:2px;flex:0 0 auto;opacity:0.6;
  }

  /* Input */
  .wf-input{
    display:flex;align-items:center;gap:8px;
    padding:8px 12px;border:1px solid var(--line);
    border-radius:3px;background:var(--paper);font-size:13px;color:var(--ink-mid);
  }
  .wf-input.wf-soft{border-color:var(--line-soft)}

  /* Stack helpers */
  .wf-stack{display:flex;flex-direction:column}
  .wf-row{display:flex}

  /* Display copy is serif italic body to elevate text — used in landing/pricing */
  .wf-serif{font-family:'Source Serif 4', Georgia, serif;font-weight:400;letter-spacing:-0.005em}
  .wf-italic{font-style:italic}

  /* Pulse for "live" indicators */
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 currentColor }
    50% { box-shadow: 0 0 0 4px currentColor }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<script type="text/babel" src="v2/design-canvas.jsx"></script>

</body>
